# VM 接网都走 X710 的 SR-IOV VF。每个 NetworkAttachmentDefinition 对应一个 VF 资源池
# （../controllers/sriov/kustomization.yaml），并规定这块 VF 的 VLAN、trust 和 spoofchk。
# 这些属性由 SR-IOV CNI 从宿主的 PF 上设置，VM 里改不了。VF 的 MAC 取 VM 定义里写的 macAddress；
# 没有 trust 的 VF 在 VM 里也改不了 MAC。
#
# 宽松模式（docs/addressing.md）：
#   - 核心网段是 VLAN 10。存储节点、各区控制面 VM 和分支都在里面，二层直接互通。
#     同在 sfp0 上的 VF 之间走网卡内部的交换，不经过光纤；分支经交换机从 sfp0 进来。
#   - 网络节点拿一块不带端口 VLAN 的干道 VF，在里面自己建 VLAN 10 子接口做核心网段的网关，
#     只处理出这个网段的流量。
#
# 其他命名空间里的 VM 用 networkName: pits-net/<名字> 引用这些网络。地址由网络节点分配，所以不设 IPAM。
# link_state 为 enable 的 VF，光纤拔掉也保持链路在线，核心网段内部照样互通。
---
# 网络节点的干道（sfp0）：不设端口 VLAN，网络节点自己打标签；允许它改 MAC、开混杂模式。
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sfp0-trunk
  namespace: pits-net
  annotations:
    k8s.v1.cni.cncf.io/resourceName: pits.io/sfp0_trunk
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "sfp0-trunk",
      "type": "sriov",
      "vlan": 0,
      "trust": "on",
      "spoofchk": "off",
      "link_state": "enable"
    }
---
# 网络节点的第二条干道（sfp1）：只对外，链路状态跟随光纤。
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sfp1-trunk
  namespace: pits-net
  annotations:
    k8s.v1.cni.cncf.io/resourceName: pits.io/sfp1_trunk
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "sfp1-trunk",
      "type": "sriov",
      "vlan": 0,
      "trust": "on",
      "spoofchk": "off",
      "link_state": "auto"
    }
---
# 存储节点：核心网段，端口 VLAN 10，只能用分给它的 MAC。
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: core-storage
  namespace: pits-net
  annotations:
    k8s.v1.cni.cncf.io/resourceName: pits.io/sfp0_storage
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "core-storage",
      "type": "sriov",
      "vlan": 10,
      "trust": "off",
      "spoofchk": "on",
      "link_state": "enable"
    }
---
# 各实验区的控制面 VM：和存储节点同一个网段，从共享池里拿 VF。
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: core-shared
  namespace: pits-net
  annotations:
    k8s.v1.cni.cncf.io/resourceName: pits.io/sfp0_shared
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "core-shared",
      "type": "sriov",
      "vlan": 10,
      "trust": "off",
      "spoofchk": "on",
      "link_state": "enable"
    }
