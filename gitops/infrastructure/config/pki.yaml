# 内部 CA：给 Keycloak、ManageIQ 等管理服务签发证书。
# 根证书只在集群里，分发到客户端时从 Secret pits-ca 里导出 ca.crt。
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pits-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: PITS Core CA
  secretName: pits-ca
  duration: 87600h # 10 年
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pits-ca
spec:
  ca:
    secretName: pits-ca
