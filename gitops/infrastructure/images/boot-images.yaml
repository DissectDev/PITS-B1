# 镜像服务：放各台 VM 的系统镜像（网络节点、存储节点、实验区控制面）和分支的网络启动镜像。
# CDI 从集群内地址 http://boot-images.pits-boot.svc/<文件名> 导入 VM 系统盘；
# 网络节点的 DHCP 给分支下发 iPXE 参数，指向 http://<宿主管理口>:30080/。
# 放在基础设施层，而不是管理服务层：核心节点重建系统盘时不能依赖管理服务。
# 镜像丢了可以重新构建，所以不备份。上传方法见 docs/bootstrap.md 的 P3。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boot-images
  namespace: pits-boot
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boot-images
  namespace: pits-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boot-images
  template:
    metadata:
      labels:
        app: boot-images
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: images
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            limits:
              memory: 64Mi
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: boot-images
---
apiVersion: v1
kind: Service
metadata:
  name: boot-images
  namespace: pits-boot
spec:
  type: NodePort
  selector:
    app: boot-images
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
