apiVersion: v1
kind: Namespace
metadata:
  name: pits-storage
  labels:
    pits.io/fault-domain: core
    pits.io/tier: business
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: btrfs-manager
  namespace: pits-storage
spec:
  selector:
    matchLabels:
      app: btrfs-manager
  updateStrategy:
    type: OnDelete
  template:
    metadata:
      labels:
        app: btrfs-manager
    spec:
      nodeSelector:
        kubernetes.io/hostname: pits-core
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      containers:
        - name: manager
          image: docker.io/library/pits-btrfs-manager:6.19.1-20261108
          imagePullPolicy: Never
          args: [manage]
          env:
            - name: FS_UUID
              value: 777b7660-ef8e-421a-ac60-d6c4cb2fea39
            - name: TZ
              value: Asia/Shanghai
            - name: TZDIR
              value: /share/zoneinfo
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            exec:
              command: [/bin/bash, /config/btrfs-manager.sh, status]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: disk1
              mountPath: /dev/disk/by-id/nvme-KINGSTON_SA2000M81000G_50026B7683F82E20-part1
            - name: disk2
              mountPath: /dev/disk/by-id/nvme-Samsung_SSD_980_1TB_S64ANS0RB40147Z-part1
            - name: disk3
              mountPath: /dev/disk/by-id/nvme-WD_BLACK_SN770_2TB_23312N400193-part1
            - name: btrfs-control
              mountPath: /dev/btrfs-control
            - name: storage
              mountPath: /srv/pits-storage
              mountPropagation: Bidirectional
            - name: state
              mountPath: /state
            - name: state
              mountPath: /var/lib/btrfs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: btrfs-manager
        - name: disk1
          hostPath:
            path: /dev/disk/by-id/nvme-KINGSTON_SA2000M81000G_50026B7683F82E20-part1
            type: BlockDevice
        - name: disk2
          hostPath:
            path: /dev/disk/by-id/nvme-Samsung_SSD_980_1TB_S64ANS0RB40147Z-part1
            type: BlockDevice
        - name: disk3
          hostPath:
            path: /dev/disk/by-id/nvme-WD_BLACK_SN770_2TB_23312N400193-part1
            type: BlockDevice
        - name: btrfs-control
          hostPath:
            path: /dev/btrfs-control
            type: CharDevice
        - name: storage
          hostPath:
            path: /srv/pits-storage
            type: Directory
        - name: state
          hostPath:
            path: /var/lib/pits/btrfs-manager
            type: Directory
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
