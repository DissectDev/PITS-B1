# 存储节点（PITS Storage）：直通三块数据盘，从 X710 的 sfp0 拿一块 VF 接核心网段（VLAN 10）。
# 它和分支在同一个二层网段里直接通信，出这个网段的流量才经过网络节点。
# 它同时是各分支集群的外部 LINSTOR controller（分支的 Piraeus 用 externalController 指向它）。
# 内部设计（ZFS 池布局、LINSTOR、SMB/NFS/S3）由 PITS Storage 决定。
#
# 状态都在直通的数据盘上；系统盘丢了从镜像重建，再重新导入存储池。
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: storage-node
  namespace: core-nodes
  labels:
    pits.io/fault-domain: core
    pits.io/tier: business
    pits.io/node-role: storage
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: storage-node-root
      spec:
        storage:
          storageClassName: local-path
          resources:
            requests:
              storage: 32Gi
        source:
          http:
            # PITS Storage 的系统镜像（例如 bootc-image-builder 生成的 qcow2），
            # P3 时上传到启动镜像服务（gitops/infrastructure/images）
            url: "http://boot-images.pits-boot.svc/storage-node.qcow2"
  template:
    metadata:
      labels:
        pits.io/fault-domain: core
        pits.io/tier: business
        pits.io/node-role: storage
    spec:
      domain:
        cpu:
          sockets: 1
          cores: 2
          threads: 2
          dedicatedCpuPlacement: true
        memory:
          # 直通 VM 的内存整块锁定，不能超卖。ZFS ARC 在 VM 内部限制。
          guest: 16Gi
        resources:
          requests:
            memory: 16Gi
        devices:
          disks:
            - name: root
              disk:
                bus: virtio
          hostDevices:
            - name: data1
              deviceName: pits.io/nvme-data
            - name: data2
              deviceName: pits.io/nvme-data
            - name: data3
              deviceName: pits.io/nvme-data
          interfaces:
            - name: core
              sriov: {}
              # 固定 MAC，存储节点在核心网段上的地址是 10.88.0.10（docs/addressing.md）
              macAddress: "02:50:00:00:00:10"
      networks:
        - name: core
          multus:
            networkName: pits-net/core-storage
      volumes:
        - name: root
          dataVolume:
            name: storage-node-root
