# 分支网络启动镜像的 HTTP 服务。镜像由 flake 构建后放进这个卷；
# 网络节点的 DHCP 给分支下发 iPXE 参数，指向 http://<宿主管理口>:30080/。
# 镜像丢了可以重新构建，所以不备份。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: boot-images
  namespace: pits-boot
spec:
  storageClassName: local-path
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boot-images
  namespace: pits-boot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boot-images
  template:
    metadata:
      labels:
        app: boot-images
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.29-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: images
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            limits:
              memory: 64Mi
      volumes:
        - name: images
          persistentVolumeClaim:
            claimName: boot-images
---
apiVersion: v1
kind: Service
metadata:
  name: boot-images
  namespace: pits-boot
spec:
  type: NodePort
  selector:
    app: boot-images
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
