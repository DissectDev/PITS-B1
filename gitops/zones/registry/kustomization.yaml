# 区清单：唯一来源。新增或退役实验区只改 zones.json（scripts/new-zone.sh 会代劳）。
# Steampipe 的连接和 ManageIQ 的 provider 都从这份清单生成；
# 合规基准里有一条检查，要求 Steampipe 的区连接数等于这里的区数。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pits-compliance
configMapGenerator:
  - name: pits-zones
    files:
      - zones.json
    options:
      labels:
        pits.io/registry: zones
