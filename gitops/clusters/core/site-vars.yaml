# GitOps 这边的站点参数，作用和宿主的 site/core.nix 一样：因环境而异的值只在这里填。
# Flux 在 management-platform、management 两个阶段里用它替换 ${VAR}。
apiVersion: v1
kind: ConfigMap
metadata:
  name: pits-site
  namespace: flux-system
data:
  # 管理服务的域名后缀，例如 keycloak.<域名>。需要在局域网 DNS 里把这些名字指向宿主管理口。
  PITS_DOMAIN: "pits.home.arpa"
  # 存储节点上的 S3（Garage，默认端口 3900）。存储节点在核心网段上的地址见 docs/addressing.md。
  PITS_S3_STORAGE_URL: "http://10.88.0.10:3900"
  PITS_S3_STORAGE_BUCKET: "pits-backup"
  PITS_S3_STORAGE_REGION: "garage"
  # 机外 S3 还没有，暂不配置；补上时的做法见 gitops/management/backup/backup.yaml 末尾。
