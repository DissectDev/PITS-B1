# 核心集群的部署顺序。每一层只依赖它前面的层。后面几段默认暂停，到对应阶段再打开
# （把 suspend 改成 false）：core-nodes 在 P3，management-platform、management、compliance 在 P4，
# zones 在 P6。P2 只部署到 policies 为止。
#
#   namespaces → controllers → config ─┬→ policies
#                local-path ───────────┤
#                keycloak-operator ────┤
#                manageiq-operator ────┤
#                                      ├→ core-nodes（P3）
#                                      ├→ management-platform → management、compliance（P4–P5）
#                                      └→ zones（P6）
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/namespaces
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/controllers
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: local-path-provisioner
  path: ./deploy
  prune: true
  wait: true
  patches:
    # 本地卷放在系统盘的 /var/lib/pits-local（由 modules/rke2.nix 创建）
    - target:
        kind: ConfigMap
        name: local-path-config
      patch: |
        - op: replace
          path: /data/config.json
          value: |-
            {"nodePathMap":[{"node":"DEFAULT_PATH_FOR_NON_LISTED_NODES","paths":["/var/lib/pits-local"]}]}
    # 设为默认存储类
    - target:
        kind: StorageClass
        name: local-path
      patch: |
        - op: add
          path: /metadata/annotations
          value:
            storageclass.kubernetes.io/is-default-class: "true"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: keycloak-k8s-resources
  path: ./kubernetes
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manageiq-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # 上游清单存放在本仓库，原因见该目录的 kustomization.yaml
  path: ./gitops/management/manageiq-operator
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/infrastructure/config
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/policies
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-nodes
  namespace: flux-system
spec:
  # P3：在 gitops/core-nodes 和 gitops/infrastructure/config/kubevirt.yaml 里填好
  # 镜像地址和数据盘的 PCI ID 之后，改成 false。
  suspend: true
  dependsOn:
    - name: config
    - name: local-path
    - name: policies
  interval: 1h
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/core-nodes
  # 核心节点被误删的代价太大，关掉 prune：从 Git 里删掉文件不会删除 VM。
  prune: false
---
# 管理服务分三段：platform 是带 CRD 的 Helm chart，services 和 compliance 用到这些 CRD，
# 放在同一个 Kustomization 里会因为 CRD 还不存在而整体失败。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management-platform
  namespace: flux-system
spec:
  suspend: true # P4 打开
  dependsOn:
    - name: config
    - name: local-path
    - name: policies
  interval: 1h
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/management/platform
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: pits-site
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: management
  namespace: flux-system
spec:
  suspend: true # P4 打开
  dependsOn:
    - name: management-platform
    - name: keycloak-operator
    - name: manageiq-operator
  interval: 1h
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/management/services
  prune: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: pits-site
---
# 合规检查里有 shell 脚本和 SQL，不做 ${VAR} 替换，所以单独一段。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: compliance
  namespace: flux-system
spec:
  suspend: true # P4 打开
  dependsOn:
    - name: management-platform
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/management/compliance
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zones
  namespace: flux-system
spec:
  # P6：控制面 VM 镜像就绪后改成 false。
  suspend: true
  dependsOn:
    - name: config
    - name: local-path
    - name: policies
  interval: 1h
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./gitops/zones/clusters
  prune: false
