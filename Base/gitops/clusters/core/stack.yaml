# 核心集群的部署顺序（仅保留已实施路径；未实施的 management-platform/services/compliance 与 zones 已归档）。
#
#   namespaces → controllers → config ─┬→ policies
#                local-path ───────────┤
#                keycloak-operator ────┤
#                manageiq-operator ────┤
#                                      └→ core-nodes (storage)
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Base/gitops/infrastructure/namespaces
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 1h
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Base/gitops/infrastructure/controllers
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path
  namespace: flux-system
spec:
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: local-path-provisioner
  path: ./deploy
  prune: true
  wait: true
  patches:
    # 本地卷放在系统盘的 /var/lib/pits-local（由 Base/modules/rke2.nix 创建）
    - target:
        kind: ConfigMap
        name: local-path-config
      patch: |
        - op: replace
          path: /data/config.json
          value: |-
            {"nodePathMap":[{"node":"DEFAULT_PATH_FOR_NON_LISTED_NODES","paths":["/var/lib/pits-local"]}]}
    # 设为默认存储类
    - target:
        kind: StorageClass
        name: local-path
      patch: |
        - op: add
          path: /metadata/annotations
          value:
            storageclass.kubernetes.io/is-default-class: "true"
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: keycloak-k8s-resources
  path: ./kubernetes
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manageiq-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 1h
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # 上游清单存放在本仓库，原因见该目录的 kustomization.yaml
  path: ./Base/gitops/management/manageiq-operator
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Base/gitops/infrastructure/config
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: policies
  namespace: flux-system
spec:
  dependsOn:
    - name: controllers
  interval: 1h
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Base/gitops/policies
  prune: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core-nodes
  namespace: flux-system
spec:
  suspend: true
  dependsOn:
    - name: config
    - name: local-path
    - name: policies
  interval: 1h
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./Base/gitops/core-nodes
  prune: false
