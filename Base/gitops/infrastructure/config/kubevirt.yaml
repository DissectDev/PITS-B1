# KubeVirt retains only VM-owned PCI devices; data NVMe belongs to the Btrfs container.
# X710 VFs continue to be allocated by the SR-IOV device plugin.
---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      # 在 KubeVirt 1.9 里这两个都还是 Alpha，需要显式打开。
      featureGates:
        - HostDevices
        - CPUManager
    permittedHostDevices:
      pciHostDevices:
        - pciVendorSelector: "8086:125B" # I226-LM（网络节点上行）
          resourceName: pits.io/i226-lm
  customizeComponents: {}
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}
---
apiVersion: cdi.kubevirt.io/v1beta1
kind: CDI
metadata:
  name: cdi
spec:
  config:
    featureGates:
      # local-path 是 WaitForFirstConsumer，CDI 要等 VM 调度后再导入镜像。
      - HonorWaitForFirstConsumer
  imagePullPolicy: IfNotPresent
  infra: {}
  workload: {}
