# Declarative VLAN 20 relay on pits-core RKE2 bridging `pits-portal` (10.90.0.1:18090)
# onto Lab VLAN 20 (10.89.20.31:18090) for `cluster-pits-lab` Istio Zero-Trust Gateway
# (`https://portal.lab.martensite.dev`). Mirrors `keycloak/keycloak-lab-relay` (10.89.20.30).
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: pits-portal-lab
  namespace: pits-net
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "pits-portal-lab",
      "type": "macvlan",
      "master": "sfp0.20",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "10.89.20.31/24"
          }
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pits-portal-lab-relay-nginx
  namespace: pits-net
data:
  nginx.conf: |
    worker_processes 1;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;
    events {
      worker_connections 512;
    }
    stream {
      server {
        listen 10.89.20.31:18090;
        # Allow only cluster-pits-lab gateway-eligible nodes (netboot-001..003,005) + self probe.
        # Blocks direct bypass from workstation host netboot-004 (10.89.20.24).
        allow 10.89.20.21;
        allow 10.89.20.22;
        allow 10.89.20.23;
        allow 10.89.20.25;
        allow 10.89.20.31;
        allow 127.0.0.1;
        deny all;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
        proxy_pass 10.90.0.1:18090;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pits-portal-lab-relay
  namespace: pits-net
  labels:
    app: pits-portal-lab-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pits-portal-lab-relay
  template:
    metadata:
      annotations:
        k8s.v1.cni.cncf.io/networks: '[{"name":"pits-portal-lab","interface":"lab0"}]'
      labels:
        app: pits-portal-lab-relay
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18090
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - nc
                - -z
                - 10.89.20.31
                - "18090"
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: pits-portal-lab-relay-nginx
