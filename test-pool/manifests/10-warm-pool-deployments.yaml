apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-portal-e2e
  namespace: pits-test-pool
  labels:
    app.kubernetes.io/name: pits-test-runner
    pits.io/pool: warm-static
    pits.io/shard: portal-e2e
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pits-test-runner
      pits.io/shard: portal-e2e
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pits-test-runner
        pits.io/pool: warm-static
        pits.io/shard: portal-e2e
    spec:
      serviceAccountName: pits-test-runner
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - netboot-003
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - netboot-004
      containers:
        - name: runner
          image: docker.io/pits/test-runner:v1.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PITS_PREWARM_PORTAL_DEPS
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "14"
              memory: 11Gi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -x /tmp/devspacehelper"]
            initialDelaySeconds: 1
            periodSeconds: 10
          volumeMounts:
            - name: ramdisk
              mountPath: /ramdisk
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: ramdisk
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
