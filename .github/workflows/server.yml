name: Server (Go pits-agent)

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  go-test:
    name: Go Vet & Race Tests (server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Run go vet and go test -race (vendored)
        working-directory: server
        run: |
          go vet -mod=vendor ./...
          go test -mod=vendor -race ./...
