name: Base (Shared NixOS & GitOps)

on:
  push:
    branches: [main]
    paths:
      - "Base/**"
      - ".github/workflows/base.yml"
  pull_request:
    paths:
      - "Base/**"
      - ".github/workflows/base.yml"
  workflow_dispatch:

jobs:
  gitops-validate:
    name: GitOps YAML & Shell Validation (Base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Base shell scripts & YAML files
        run: |
          set -euo pipefail
          for bin in bash python3; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "Missing required toolchain binary: $bin" >&2
              exit 1
            fi
          done
          for f in Base/scripts/*.sh Base/gitops/core-nodes/storage/*.sh; do
            bash -n "$f"
          done
          python3 -c '
          import glob, sys, yaml
          files = sorted(glob.glob("Base/gitops/**/*.yaml", recursive=True))
          for path in files:
              with open(path, "r", encoding="utf-8") as fh:
                  list(yaml.safe_load_all(fh))
          print(f"Validated {len(files)} Base/gitops YAML files.")
          '

  nix-flake-eval:
    name: NixOS Flake Evaluation (Base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate ci-core and ci-core-disko (when nix is present)
        working-directory: Base
        run: |
          set -euo pipefail
          if ! command -v nix >/dev/null 2>&1; then
            echo "nix is not preinstalled in offline cicd-runner; Base flake evaluation is executed on pits-core via CICD/scripts/Deploy-CoreArtifacts.ps1 -Target base."
            exit 0
          fi
          nix --extra-experimental-features 'nix-command flakes' eval .#nixosConfigurations.ci-core.config.system.build.toplevel.drvPath
          nix --extra-experimental-features 'nix-command flakes' eval .#nixosConfigurations.ci-core-disko.config.system.build.toplevel.drvPath
