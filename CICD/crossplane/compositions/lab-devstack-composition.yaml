                    labels:
                      app.kubernetes.io/name: pits-cicd-runner
                      pits.io/runner-pool: cpu
                  spec:
                    replicas: {{ $cpuReplicas }}
                    selector:
                      matchLabels:
                        app.kubernetes.io/name: pits-cicd-runner
                        pits.io/runner-pool: cpu
                    template:
                      metadata:
                        labels:
                          app.kubernetes.io/name: pits-cicd-runner
                          pits.io/runner-pool: cpu
                      spec:
                        serviceAccountName: pits-cicd-runner
                        topologySpreadConstraints:
                          - maxSkew: 1
                            topologyKey: kubernetes.io/hostname
                            whenUnsatisfiable: ScheduleAnyway
                            labelSelector:
                              matchLabels:
                                app.kubernetes.io/name: pits-cicd-runner
                                pits.io/runner-pool: cpu
                        affinity:
                          nodeAffinity:
                            requiredDuringSchedulingIgnoredDuringExecution:
                              nodeSelectorTerms:
                                - matchExpressions:
                                    - key: kubernetes.io/hostname
                                      operator: In
                                      values: ["netboot-001", "netboot-002", "netboot-003"]
                                    - key: kubernetes.io/hostname
                                      operator: NotIn
                                      values: {{ $excludeNodes | toJson }}
                        containers:
                          - name: act-runner
                            image: docker.io/pits/cicd-runner:v1.1
                            imagePullPolicy: IfNotPresent
                            env:
                              - name: GITEA_INSTANCE_URL
                                value: "http://gitea-http.{{ $ns }}.svc.cluster.local:3000"
                              - name: GITEA_RUNNER_NAME
                                valueFrom:
                                  fieldRef:
                                    fieldPath: metadata.name
                              - name: GITEA_RUNNER_LABELS
                                value: "pits-lab-rust:host,pits-lab-windows:host,pits-lab-go:host,pits-lab-e2e:host,ubuntu-latest:host"
                              - name: GITEA_RUNNER_REGISTRATION_TOKEN
                                valueFrom:
                                  secretKeyRef:
                                    name: gitea-runner-token
                                    key: GITEA_RUNNER_REGISTRATION_TOKEN
                              - name: PITS_ZOT_URL
                                value: "http://zot.{{ $ns }}.svc.cluster.local:5000"
                              - name: PITS_ATTIC_URL
                                value: "http://attic.{{ $ns }}.svc.cluster.local:8080"
                            command: ["/usr/local/bin/cicd-runner-entrypoint"]
                            volumeMounts:
                              - name: ramdisk
                                mountPath: /ramdisk
                              - name: tmp
                                mountPath: /tmp
                            resources:
                              requests:
                                cpu: 200m
                                memory: 512Mi
                              limits:
                                cpu: "16"
                                memory: 12Gi
                        volumes:
                          - name: ramdisk
                            emptyDir:
                              medium: Memory
                              sizeLimit: 10Gi
                          - name: tmp
                            emptyDir:
                              medium: Memory
                              sizeLimit: 2Gi
            ---
