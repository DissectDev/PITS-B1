                    name: pits-cicd-runner
                    namespace: pits-test-pool
                  roleRef:
                    apiGroup: rbac.authorization.k8s.io
                    kind: Role
                    name: pits-cicd-runner
                  subjects:
                    - kind: ServiceAccount
                      name: pits-cicd-runner
                      namespace: pits-test-pool
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
            metadata:
              name: {{ $xr.metadata.name }}-runner-cpu
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: runner-cpu
                gotemplating.fn.crossplane.io/ready: "{{ template "isReady" (list $obs "runner-cpu") }}"
            spec:
              forProvider:
                manifest:
