                gotemplating.fn.crossplane.io/ready: "{{ template "isReady" (list $obs "runner-role") }}"
            spec:
              forProvider:
                manifest:
                  apiVersion: rbac.authorization.k8s.io/v1
                  kind: Role
                  metadata:
                    name: pits-cicd-runner
                    namespace: pits-test-pool
                  rules:
                    - apiGroups: [""]
                      resources: ["pods", "pods/exec", "pods/log", "configmaps", "secrets", "services"]
                      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                    - apiGroups: ["batch"]
                      resources: ["jobs"]
                      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                    - apiGroups: ["resource.k8s.io"]
                      resources: ["resourceclaims"]
                      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                    - apiGroups: ["extensions.agents.x-k8s.io", "agents.x-k8s.io"]
                      resources: ["sandboxclaims", "sandboxes", "sandboxtemplates", "sandboxwarmpools"]
                      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
            ---
            apiVersion: kubernetes.crossplane.io/v1alpha2
            kind: Object
