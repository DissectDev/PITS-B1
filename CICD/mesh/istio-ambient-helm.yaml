# Istio 1.30.8 Ambient Mode (base + istiod + cni + ztunnel) via Flux HelmRepository/HelmRelease.
# Charts are mirrored into Lab Zot OCI (oci://zot.pits-cicd.svc.cluster.local:5000/istio-charts)
# and container images into talos-image-cache (docker.io/istio/*:1.30.8-distroless).
# All control-plane and node-level pods strictly exclude netboot-004 (win11-001 host).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: istio-charts
  namespace: istio-system
spec:
  type: oci
  interval: 10m
  url: oci://zot.pits-cicd.svc.cluster.local:5000/istio-charts
  insecure: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 10m
  chart:
    spec:
      chart: base
      version: "1.30.8"
      sourceRef:
        kind: HelmRepository
        name: istio-charts
        namespace: istio-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    defaultRevision: default
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 10m
  dependsOn:
    - name: istio-base
      namespace: istio-system
  chart:
    spec:
      chart: istiod
      version: "1.30.8"
      sourceRef:
        kind: HelmRepository
        name: istio-charts
        namespace: istio-system
  values:
    profile: ambient
    trustedZtunnelNamespace: ztunnel
    autoscaleEnabled: false
    replicaCount: 1
    global:
      hub: docker.io/istio
      tag: "1.30.8"
      variant: distroless
      imagePullPolicy: IfNotPresent
      defaultPodDisruptionBudget:
        enabled: false
      waypoint:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: NotIn
                      values:
                        - netboot-004
    gatewayClasses:
      istio:
        deployment:
          spec:
            template:
              spec:
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                        - matchExpressions:
                            - key: kubernetes.io/hostname
                              operator: NotIn
                              values:
                                - netboot-004
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - netboot-004
    meshConfig:
      extensionProviders:
        - name: oauth2-proxy-ext-authz
          envoyExtAuthzHttp:
            service: oauth2-proxy.iam-system.svc.cluster.local
            port: 4180
            failOpen: false
            includeRequestHeadersInCheck:
              - authorization
              - cookie
              - x-forwarded-for
              - x-forwarded-host
              - x-forwarded-proto
            headersToUpstreamOnAllow:
              - authorization
              - x-auth-request-user
              - x-auth-request-email
              - x-auth-request-preferred-username
              - x-auth-request-access-token
            headersToDownstreamOnAllow:
              - set-cookie
            headersToDownstreamOnDeny:
              - content-type
              - set-cookie
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  interval: 10m
  dependsOn:
    - name: istio-base
      namespace: istio-system
    - name: istiod
      namespace: istio-system
  chart:
    spec:
      chart: cni
      version: "1.30.8"
      sourceRef:
        kind: HelmRepository
        name: istio-charts
        namespace: istio-system
  values:
    profile: ambient
    cniBinDir: /opt/cni/bin
    cniConfDir: /etc/cni/net.d
    chained: true
    ambient:
      enabled: true
    global:
      hub: docker.io/istio
      tag: "1.30.8"
      variant: distroless
      imagePullPolicy: IfNotPresent
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - netboot-004
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: ztunnel
spec:
  interval: 10m
  dependsOn:
    - name: istiod
      namespace: istio-system
    - name: istio-cni
      namespace: istio-system
  chart:
    spec:
      chart: ztunnel
      version: "1.30.8"
      sourceRef:
        kind: HelmRepository
        name: istio-charts
        namespace: istio-system
  values:
    profile: ambient
    hub: docker.io/istio
    tag: "1.30.8"
    variant: distroless
    imagePullPolicy: IfNotPresent
    istioNamespace: istio-system
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - netboot-004
