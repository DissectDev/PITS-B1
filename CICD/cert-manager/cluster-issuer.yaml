# Public ACME ClusterIssuer (ZeroSSL DV90 + Cloudflare DNS-01) for *.lab.martensite.dev.
# Directly reachable from cluster-pits-lab without external proxy; renews autonomously every 60d.
# Consumes runtime Secrets cert-manager/cloudflare-api-token and cert-manager/zerossl-eab-secret.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: acme-cloudflare-dns01
spec:
  acme:
    server: https://acme.zerossl.com/v2/DV90
    email: admin@martensite.dev
    privateKeySecretRef:
      name: acme-cloudflare-account-key
    externalAccountBinding:
      keyID: "Ay0kfb4BznveQQDFU0K3Cg"
      keySecretRef:
        name: zerossl-eab-secret
        key: hmac-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - martensite.dev
