# Declarative CNPG PostgreSQL 17.6 SSOT cluster for PITS Self-Managed Project Hub.
# - 2 HA instances on mayastor-2 (10Gi), strictly excluding workstation host netboot-004.
# - Exposes primary via VLAN 20 externalIPs (10.89.20.21:35432 -> 5432) for pits-core outbox sync.
---
apiVersion: v1
kind: Secret
metadata:
  name: hub-pg-auth
  namespace: pits-cicd
  labels:
    app.kubernetes.io/name: hub-pg
    app.kubernetes.io/part-of: pits-project-hub
type: kubernetes.io/basic-auth
stringData:
  username: pitshub
  password: pits-hub-pg-lab-2026
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hub-pg
  namespace: pits-cicd
  labels:
    app.kubernetes.io/name: hub-pg
    app.kubernetes.io/part-of: pits-project-hub
spec:
  instances: 2
  enableSuperuserAccess: true
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6
  imagePullPolicy: IfNotPresent
  storage:
    storageClass: mayastor-2
    size: 10Gi
  bootstrap:
    initdb:
      database: project_hub
      owner: pitshub
      secret:
        name: hub-pg-auth
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - netboot-001
                  - netboot-002
                  - netboot-003
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - netboot-004
---
apiVersion: v1
kind: Service
metadata:
  name: hub-pg-external
  namespace: pits-cicd
  labels:
    app.kubernetes.io/name: hub-pg
    app.kubernetes.io/part-of: pits-project-hub
spec:
  type: ClusterIP
  externalIPs:
    - "10.89.20.21"
  ports:
    - name: postgres
      port: 35432
      targetPort: 5432
      protocol: TCP
  selector:
    cnpg.io/cluster: hub-pg
    cnpg.io/instanceRole: primary
