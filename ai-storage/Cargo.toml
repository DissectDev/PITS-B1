[package]
name = "ai-store"
version = "0.1.0"
edition = "2021"
description = "OpenDAL-backed 5-layer AI Storage Runtime (8 Archetypes VFS, ProjectProfile Policy Engine, Streamable HTTP & Singleton Daemon MCP Server)"
authors = ["PITS Infrastructure"]

[[bin]]
name = "ai-store"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
bytes = "1.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
globset = "0.4"
hex = "0.4"
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
opendal = { version = "0.59", default-features = false, features = [
    "auto-register-services",
    "executors-tokio",
    "reqwest-rustls-no-provider-tls",
    "services-fs",
    "services-memory",
    "services-s3",
    "services-http",
    "services-hf",
    "layers-retry",
    "layers-timeout",
    "layers-concurrent-limit",
    "layers-logging",
    "layers-metrics",
] }
redis = { version = "0.29", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
regex = "1.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync", "signal", "process"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
