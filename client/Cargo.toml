[package]
name = "pitsctl"
version = "1.0.0"
edition = "2021"
description = "Unified native Rust PITS client & Web Console for RKE2 Router, NVMe/TCP SAN, Tinkerbell PXE, Talos Linux, Dual K8s Control Planes, and KubeVirt VM Manager"
authors = ["PITS Infrastructure"]

[[bin]]
name = "pitsctl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = "0.22"
bytes = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "pem"] }
hex = "0.4"
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1.5", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2"] }
ipnet = { version = "2.10", features = ["serde"] }
rand = "0.8"
regex = "1.11"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-pemfile = "2.2"
rustls-pki-types = "1.10"
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync", "signal", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
x509-cert = { version = "0.2", features = ["builder", "pem"] }
